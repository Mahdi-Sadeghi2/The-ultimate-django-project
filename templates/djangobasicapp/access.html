<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body>
    <div>
        <a href="{% url 'create'%}" class="btn btn-primary">Create New Employee</a>
    </div>

      <table class="table table-striped table-bordered table-hover" style="background-color: black;">
        <thead class="table-dark">
            <tr>
                <th>Employee ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Title</th>    
                <th>Country</th>       
            </tr>
        </thead class="table-light">
        <tbody>
            {% for emp in Employees %}
            <tr>
                <td>{{emp.id}}</td>
                <td>{{emp.fisrt_name}}</td>
                <td>{{emp.last_name}}</td>
                <td>{{emp.tilte_name}}</td>
                <td>{{emp.country }}</td>
                
                
                <td>
                    <a href="{% url 'detail' emp.id%}" class="btn btn-warning">Details</a>
                    <a href="{% url 'edit' emp.id %}" class="btn btn-success">Edit</a> 
                    <a href="{% url 'delete' emp.id %}" class="btn btn-danger">Delete</a>  
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
