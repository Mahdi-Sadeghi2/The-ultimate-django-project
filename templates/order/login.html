{% extends 'order/basic.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p>Dont' have an account? <a href="{% url 'signup' %}">Sign Up here</a></p>
    
{% endblock %}
