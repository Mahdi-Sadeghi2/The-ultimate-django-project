{% block title %}Delete Account{% endblock %}

{% block content %}
    <h2>Delete Account</h2>
    <p>Are you sure you want to delete your account?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Delete Account</button>
    </form>
    
{% endblock %}
