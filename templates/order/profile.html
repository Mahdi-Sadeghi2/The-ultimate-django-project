{% extends 'order/basic.html' %}

{% block title %}Change Profile{% endblock %}

{% block content %}
    <h2>Change Profile</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Change Profile</button>
    </form>
    <p>Dont' have an account? <a href="{% url 'signup' %}">Sign Up here</a></p>
    
{% endblock %}
